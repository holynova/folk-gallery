<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">印画图鉴 Folk &amp; Stamp Gallery — 农民画与橡皮印章，321 幅</title>
  <desc id="desc">暖纸底标题：印画图鉴；右侧是四类图鉴的 2×2 小画框：农民画、文物图章、橡皮图章、游戏印章，各带幅数。</desc>

  <rect width="1200" height="360" rx="26" fill="#f7ecd7"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8c2b23">静态图鉴 · STATIC GALLERY · V1.1.0</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#8c2b23">印画图鉴</text>
    <text x="56" y="168" font-size="23" fill="#1c1a17">FOLK &amp; STAMP GALLERY — 农民画与橡皮印章</text>
    <text x="56" y="204" font-size="19" fill="#5a564e">321 幅图像：农民画、文物橡皮图章、橡皮图章与游戏印章。</text>
    <g id="chips" font-size="18" fill="#1c1a17" text-anchor="middle">
      <g><rect x="56" y="238" width="96" height="36" rx="18" fill="#ffffff" stroke="#ddd2b8" stroke-width="1.5"/><text x="104" y="262">321 幅</text></g>
      <g><rect x="164" y="238" width="114" height="36" rx="18" fill="#ffffff" stroke="#ddd2b8" stroke-width="1.5"/><text x="221" y="262">4 大图鉴</text></g>
      <g><rect x="290" y="238" width="132" height="36" rx="18" fill="#ffffff" stroke="#ddd2b8" stroke-width="1.5"/><text x="356" y="262">WebP 全站</text></g>
      <g><rect x="434" y="238" width="132" height="36" rx="18" fill="#ffffff" stroke="#ddd2b8" stroke-width="1.5"/><text x="500" y="262">灯箱 + 键盘</text></g>
    </g>
  </g>

  <g id="tiles" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- labels first: they sit on the paper background -->
    <g id="labels" font-size="18" fill="#1c1a17" text-anchor="middle">
      <text x="850" y="182">农民画 · 64</text>
      <text x="1042" y="182">文物章 · 174</text>
      <text x="850" y="330">橡皮章 · 70</text>
      <text x="1042" y="330">游戏章 · 13</text>
    </g>
    <!-- tile 1: folk painting -->
    <g>
      <rect x="760" y="48" width="180" height="112" rx="8" fill="#a8d8ea"/>
      <polygon points="760,160 820,96 880,130 940,110 940,160" fill="#6fbf6f"/>
      <rect x="800" y="118" width="44" height="30" fill="#ffffff"/>
      <polygon points="796,118 822,100 848,118" fill="#2f3542"/>
      <circle cx="916" cy="70" r="10" fill="#f9d879"/>
      <circle cx="838" cy="140" r="5" fill="#c0392b"/>
    </g>
    <!-- tile 2: relic stamp -->
    <g>
      <rect x="952" y="48" width="180" height="112" rx="8" fill="#efe6d0"/>
      <ellipse cx="1010" cy="116" rx="26" ry="16" fill="#1c1a17"/>
      <circle cx="1030" cy="96" r="10" fill="#1c1a17"/>
      <polygon points="1038,92 1052,97 1038,101" fill="#1c1a17"/>
      <line x1="1000" y1="130" x2="1000" y2="148" stroke="#1c1a17" stroke-width="3"/>
      <line x1="1016" y1="130" x2="1016" y2="148" stroke="#1c1a17" stroke-width="3"/>
      <rect x="1080" y="72" width="10" height="66" rx="2" fill="#b5892e"/>
      <rect x="1072" y="80" width="26" height="14" rx="2" fill="#b5892e"/>
      <rect x="1074" y="124" width="22" height="14" rx="2" fill="#b5892e"/>
    </g>
    <!-- tile 3: rubber stamp mountain -->
    <g>
      <rect x="760" y="196" width="180" height="112" rx="8" fill="#efe6d0"/>
      <polygon points="772,308 830,216 868,262 900,224 928,308" fill="#1c1a17"/>
      <polygon points="830,216 842,238 830,232 818,238" fill="#f7ecd7"/>
      <circle cx="908" cy="224" r="12" fill="#c0392b"/>
    </g>
    <!-- tile 4: game stamp -->
    <g>
      <rect x="952" y="196" width="180" height="112" rx="8" fill="#c0392b"/>
      <rect x="1004" y="224" width="34" height="34" rx="4" fill="#f7ecd7"/>
      <text x="1021" y="251" font-size="24" font-weight="700" fill="#8c2b23" text-anchor="middle">?</text>
      <rect x="1052" y="236" width="30" height="22" rx="10" fill="#f7ecd7"/>
      <circle cx="1067" cy="232" r="8" fill="#f7ecd7"/>
      <rect x="964" y="286" width="156" height="10" fill="#8c2b23"/>
      <rect x="964" y="276" width="156" height="4" fill="#f7ecd7" opacity="0.5"/>
    </g>
  </g>
</svg>
