<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f6efe0;color:#3a3226;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.6}
header{background:#b5342a;color:#fff8ea;padding:36px 20px;text-align:center;border-bottom:6px solid #2c5f8a}
header h1{font-size:2rem;letter-spacing:.15em;margin-bottom:8px}
header p{opacity:.92;font-size:.95rem}
nav{position:sticky;top:0;z-index:50;background:#fff8ea;border-bottom:2px solid #e0d3b8;padding:10px;text-align:center}
nav a{color:#b5342a;text-decoration:none;margin:0 14px;font-weight:600;font-size:.95rem}
nav a:hover{color:#2c5f8a}
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
h2{font-size:1.5rem;color:#b5342a;border-left:8px solid #b5342a;padding-left:12px;margin:36px 0 18px}
h3{font-size:1.15rem;color:#2c5f8a;margin:26px 0 14px;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#fffdf6;border:1px solid #e4d7bc;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee5cf}
.card figcaption{padding:10px 12px;font-size:.95rem;font-weight:600;color:#3a3226;text-align:center;border-top:3px solid #2c5f8a}
footer{text-align:center;padding:28px;color:#8a7a5c;font-size:.85rem}
#lightbox{position:fixed;inset:0;background:rgba(20,14,8,.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#lightbox.open{display:flex}
#lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border:4px solid #fff8ea;border-radius:6px}
#lightbox .cap{color:#fff8ea;margin-top:12px;font-size:1.1rem;font-weight:600}
#lightbox .btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,248,234,.15);color:#fff8ea;border:2px solid #fff8ea;border-radius:50%;width:48px;height:48px;font-size:1.4rem;cursor:pointer}
#lightbox .btn:hover{background:rgba(255,248,234,.35)}
#prev{left:16px}#next{right:16px}
#close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff8ea;font-size:2rem;cursor:pointer}
@media(max-width:600px){header h1{font-size:1.5rem}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}}
</style>
</head>

<div id="lightbox" role="dialog" aria-modal="true">
  <button id="close" aria-label="关闭">×</button>
  <button class="btn" id="prev" aria-label="上一张">‹</button>
  <img id="lbimg" src="" alt="">
  <div class="cap" id="lbcap"></div>
  <button class="btn" id="next" aria-label="下一张">›</button>
</div>
<script>
var cards=Array.prototype.slice.call(document.querySelectorAll('.card'));
var lb=document.getElementById('lightbox'),lbimg=document.getElementById('lbimg'),lbcap=document.getElementById('lbcap'),cur=0;
function show(i){cur=(i+cards.length)%cards.length;var c=cards[cur];lbimg.src=c.querySelector('img').src;lbimg.alt=c.querySelector('figcaption').textContent;lbcap.textContent=(cur+1)+' / 64 · '+lbimg.alt;}
cards.forEach(function(c,i){c.addEventListener('click',function(){lb.classList.add('open');show(i);});});
document.getElementById('close').onclick=function(){lb.classList.remove('open');};
document.getElementById('prev').onclick=function(e){e.stopPropagation();show(cur-1);};
document.getElementById('next').onclick=function(e){e.stopPropagation();show(cur+1);};
lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1);});
</script>
